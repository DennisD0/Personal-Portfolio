<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <defs>
    <linearGradient id="comet-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdfdff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fdfdff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Comet streaking across -->
  <g transform="rotate(-16 16 16)">
    <rect x="-6" y="15.2" width="34" height="1.8" rx="0.9" fill="url(#comet-trail)"/>
    <circle cx="26" cy="16.1" r="1.7" fill="#ffffff"/>
  </g>
</svg>
