<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <defs>
    <clipPath id="d-bowl">
      <rect x="16" y="0" width="16" height="32"/>
    </clipPath>
    <linearGradient id="comet-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdfdff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fdfdff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- D monogram -->
  <path d="M16,7 a9,9 0 1,0 0,18 a9,9 0 1,0 0,-18 Z M16,10.5 a5.5,5.5 0 1,0 0,11 a5.5,5.5 0 1,0 0,-11 Z" fill="#fdfdff" fill-rule="evenodd" clip-path="url(#d-bowl)" opacity="0.85"/>
  <rect x="12.5" y="7" width="3.5" height="18" fill="#fdfdff" opacity="0.85"/>

  <!-- Comet streaking through the counter -->
  <g transform="rotate(-16 19 17)">
    <rect x="-6" y="16" width="28" height="1.6" rx="0.8" fill="url(#comet-trail)"/>
    <circle cx="24" cy="16.8" r="1.5" fill="#ffffff"/>
  </g>
</svg>
